name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest

  package:
    name: Build and wheel smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - name: Install wheel
        run: python -m pip install dist/*.whl
      - name: Verify packaged app and static assets
        working-directory: /tmp
        run: |
          python - <<'PY'
          import json
          import socket
          import subprocess
          import sys
          import time
          from urllib.request import urlopen

          port = 18765
          base = f"http://127.0.0.1:{port}"
          proc = subprocess.Popen(
              [sys.executable, "-m", "uvicorn", "vectorrf.app:app", "--host", "127.0.0.1", "--port", str(port)],
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
          )
          try:
              deadline = time.monotonic() + 15
              while time.monotonic() < deadline:
                  if proc.poll() is not None:
                      output = proc.stdout.read() if proc.stdout else ""
                      raise RuntimeError(f"packaged app exited early:\n{output}")
                  try:
                      with socket.create_connection(("127.0.0.1", port), timeout=0.2):
                          break
                  except OSError:
                      time.sleep(0.1)
              else:
                  raise RuntimeError("packaged app did not start within 15 seconds")

              for path in ("/", "/help", "/assets/app.js", "/assets/styles.css", "/api/health", "/api/catalog"):
                  with urlopen(base + path, timeout=5) as response:
                      body = response.read()
                      assert response.status == 200, (path, response.status, body[:200])

              with urlopen(base + "/api/health", timeout=5) as response:
                  health = json.load(response)
              assert health["version"] == "1.2.0", health
              print("wheel smoke test passed")
          finally:
              proc.terminate()
              try:
                  proc.wait(timeout=5)
              except subprocess.TimeoutExpired:
                  proc.kill()
                  proc.wait(timeout=5)
          PY

  ui-smoke:
    name: Browser smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install application and Playwright
        run: python -m pip install -e '.[ui-test]'
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run deterministic UI smoke test
        run: python tests/ui/ui_smoke.py
