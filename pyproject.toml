[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vectorrf-lab"
version = "2.1.0"
description = "Local vector signal and DSP workbench: composite transmitter, spectrum analyzer, receiver, classifier and radar simulator, with I/Q recordings up to GS/s rates"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["sdr", "dsp", "signal-processing", "radar", "rf", "ofdm", "iq", "sigmf", "fastapi"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
]

[project.optional-dependencies]
perf = ["numba>=0.60", "pyfftw>=0.15"]
dev = [
  "build>=1.2",
  "httpx>=0.27",
  "httpx2>=2.0",
  "pytest>=8.0",
  "pytest-cov>=5.0",
]
ui-test = ["playwright>=1.48,<2"]

[project.scripts]
vectorrf-lab = "vectorrf.cli:main"

[tool.setuptools]
package-dir = {"" = "backend"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
vectorrf = ["web/*.html", "web/*.css", "web/js/**/*.js"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "-q"
